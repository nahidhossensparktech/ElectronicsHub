site_name: Electronic Hub.bd
site_description: Planning docs and task progress for Electronic Hub.bd
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: blue
      toggle: { icon: material/weather-sunny, name: Light mode }
markdown_extensions:
  - tables
  - admonition
  - toc: { permalink: true }
nav:
  - Progress: PROGRESS.md
  - Tasks: TASKS.md
  - Product (PRD): PRD.md
  - Technical (TRD): TRD.md
  - Design: DESIGN.md
  - Folder Architecture: FOLDER_ARCHITECTURE.md
